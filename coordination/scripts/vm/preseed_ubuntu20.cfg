# RoboCup 2026 - Ubuntu 20.04.6 Desktop 无人值守安装应答
# 用法：在 VM 首次启动时，编辑 GRUB "Install Ubuntu" 条目，在 linux 行追加：
#   automatic-ubiquity preseed/file=/cdrom/preseed/robocup.seed quiet splash ---
# （或把本文件放到 ISO 的 /preseed/robocup.seed 后由启动参数引用）
# 也可通过 HTTP 提供：boot 参数加  auto url=http://<host>:<port>/preseed_ubuntu20.cfg

#### 本地化
d-i debian-installer/language string en
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

#### 网络
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string robocup-vm
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

#### 镜像（国内走清华源，避免 archive.ubuntu.com 慢/被墙）
d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

#### 时钟
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

#### 用户与密码
d-i passwd/root-login boolean false
d-i passwd/user-fullname string robocup
d-i passwd/username string robocup
d-i passwd/user-password password CHANGE_ME_BEFORE_INSTALL
d-i passwd/user-password-again password CHANGE_ME_BEFORE_INSTALL
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string adm cdrom sudo dip plugdev lpadmin lxd sambashare

#### 分区：整盘单分区（80 GB 动态盘，不用 LVM 以简化）
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### 软件
tasksel tasksel/first multiselect ubuntu-desktop
d-i pkgsel/install-language-support boolean false
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select none

#### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note

#### 收尾：开 SSH、装 VMware Tools（桌面版）、关屏保
d-i preseed/late_command string \
  in-target sh -c 'apt-get update -y; \
  apt-get install -y openssh-server open-vm-tools-desktop; \
  sed -i "s/^#\?PasswordAuthentication .*/PasswordAuthentication yes/" /etc/ssh/sshd_config; \
  systemctl enable ssh; \
  systemctl enable open-vm-tools-desktop; \
  echo "[robocup] preseed late_command done"' ; \
  echo "[robocup] preseed finished"

#### 装完不弹出额外提示，直接重启
d-i debian-installer/exit/reboot boolean true
